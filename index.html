<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Watchlista</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 750px; margin: auto; }
    input, button, select { padding: 6px 10px; margin: 4px 2px; font-family: inherit; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: left; vertical-align: middle; }
    th { background: #f4f4f4; }
    .hidden { display: none; }
    .auth-box { border: 1px solid #ccc; padding: 15px; border-radius: 4px; }
    .error { color: red; font-size: 12px; }
    .watched-row { opacity: 0.6; }
    .filters-bar { display: flex; gap: 8px; margin-top: 15px; align-items: center; }
    textarea { font-family: inherit; padding: 6px; width: 100%; box-sizing: border-box; resize: vertical; }
    .detail-box { border: 1px solid #ccc; padding: 15px; border-radius: 4px; }
    .back-link { display: inline-block; margin-bottom: 10px; }
    .detail-meta { color: #888; font-size: 12px; }
    .saved-status { color: green; font-size: 12px; margin-left: 8px; }
    .title-meta { color: #888; font-size: 11px; }
    .poster { border: 1px solid #ccc; }
    .star { cursor: pointer; color: #e2a400; }
    .star.off { color: #b0b0b0; }
    .stars-box { font-size: 22px; }
    .tytul-wrap { position: relative; display: inline-block; }
    .suggestions { position: absolute; left: 0; right: 0; background: #fff; border: 1px solid #aaa; z-index: 10; }
    .suggestion { padding: 6px 10px; cursor: pointer; }
    .suggestion:hover { background: #f4f4f4; }

    /* TRYB CIEMNY */
    body.dark { background: #1b1b1b; color: #ddd; }
    body.dark a { color: #9cc3ff; }
    body.dark th { background: #262626; }
    body.dark th, body.dark td { border-color: #4a4a4a; }
    body.dark input, body.dark select, body.dark button, body.dark textarea { background: #242424; color: #ddd; border: 1px solid #565656; }
    body.dark .auth-box, body.dark .detail-box { border-color: #565656; }
    body.dark .suggestions { background: #242424; border-color: #565656; }
    body.dark .suggestion:hover { background: #333; }
    body.dark .title-meta, body.dark .detail-meta { color: #999; }
    body.dark .poster { border-color: #565656; }
    body.dark .star.off { color: #6e6e6e; }
  </style>
</head>
<body>

  <!-- 0. PRZYCISK MOTYWU -->
  <button id="btnTheme" title="Zmień motyw" style="position: fixed; top: 12px; right: 12px;">☾</button>

  <!-- 1. SEKCJA LOGOWANIA -->
  <div id="auth-section" class="auth-box">
    <h3>Logowanie</h3>
    <input type="email" id="emailInput" placeholder="Twój e-mail"><br>
    <input type="password" id="passInput" placeholder="Hasło (min. 6 znaków)"><br>
    <button id="btnLogin">Zaloguj</button>
    <button id="btnRegister">Zarejestruj</button>
    <div id="authError" class="error"></div>
  </div>

  <!-- 2. SEKCJA GŁÓWNA -->
  <div id="app-section" class="hidden">
    <p>Zalogowano: <b id="userEmail"></b> <button id="btnLogout">Wyloguj</button></p>

    <!-- FORMULARZ DODAWANIA -->
    <form id="addForm">
      <span class="tytul-wrap">
        <input type="text" id="titleInput" placeholder="Tytuł..." required style="width: 220px;" autocomplete="off">
        <div id="suggestions" class="suggestions hidden"></div>
      </span>

      <select id="typeInput">
        <option value="">Typ (-)</option>
        <option value="movie">Film</option>
        <option value="tv">Serial</option>
      </select>

      Ocena: <span id="ratingStars"></span>

      <label style="margin: 0 8px;">
        <input type="checkbox" id="watchedInput"> Obejrzane
      </label>

      <button type="submit">Dodaj</button>
    </form>

    <!-- PASEK WYSZUKIWANIA I SORTOWANIA -->
    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Szukaj po tytule..." style="flex: 1;">

      <select id="viewFilter">
        <option value="all">Wszystkie (Nieobejrzane na górze)</option>
        <option value="unwatched">Tylko nieobejrzane</option>
        <option value="watched">Tylko obejrzane</option>
        <option value="movies">Tylko filmy</option>
        <option value="tv">Tylko seriale</option>
        <option value="rating_desc">Najwyższa ocena najpierw</option>
      </select>
    </div>

    <!-- EKSPORT I IMPORT CSV -->
    <div class="filters-bar">
      <button id="btnExport">Eksportuj CSV</button>
      <button id="btnImport">Importuj CSV</button>
      <input type="file" id="csvFile" accept=".csv" class="hidden">
    </div>

    <!-- TABELA -->
    <table>
      <thead>
        <tr>
          <th style="width: 30px;">Obejrzane</th>
          <th>Tytuł</th>
          <th style="width: 100px;">Ocena</th>
          <th style="width: 60px;">Akcja</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- 3. STRONA TYTUŁU -->
  <div id="detail-section" class="hidden">
    <a href="#/" class="back-link">&larr; Wróć do listy</a>
    <div class="detail-box">
      <img id="detailPoster" class="poster hidden" alt="" style="float: right; max-width: 180px; margin: 0 0 10px 15px;">
      <h2 id="detailTitle" style="margin-top: 0;"></h2>
      <div id="detailMetaLine" class="title-meta"></div>

      <p>
        <label style="margin: 0 8px;">
          <input type="checkbox" id="detailWatched"> Obejrzane
        </label>

        Ocena: <span id="detailStars" class="stars-box"></span>
      </p>

      <h3>Opis</h3>
      <textarea id="descInput" rows="7" placeholder="Twój opis, przemyślenia, notatki..."></textarea><br>
      <button id="btnSaveDesc">Zapisz opis</button>
      <span id="saveStatus" class="saved-status"></span>

      <p id="detailMeta" class="detail-meta"></p>
      <p><a id="detailMal" class="hidden" href="#" target="_blank" rel="noopener">Otwórz na MyAnimeList ↗</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      updateDoc,
      doc,
      serverTimestamp,
      Timestamp,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {       apiKey: "AIzaSyAi84JAM0e1M7muvpq4CcJJA7NahEhwEVE",       authDomain: "watchlist-bfe31.firebaseapp.com",       projectId: "watchlist-bfe31",       storageBucket: "watchlist-bfe31.firebasestorage.app",       messagingSenderId: "586950061109",       appId: "1:586950061109:web:578da030d6b52586ab957c"     };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // BAZA ANIME: ANILIST (https://anilist.co) - bez klucza i bez rejestracji
    // Dane zawierają też ID MyAnimeList, więc linki do MAL działają jak dotychczas.
    const ANILIST_API = "https://graphql.anilist.co";

    let currentUser = null;
    let allItems = [];
    let unsubscribeFirestore = null;
    let currentDetailId = null;
    let nowaOcena = null;        // ocena wybierana gwiazdkami w formularzu dodawania
    let wynikiAnime = [];        // ostatnie wyniki wyszukiwania w bazie anime
    let wybranyAnime = null;     // pozycja wybrana z podpowiedzi
    let licznikSzukania = null;  // opóźnienie wyszukiwania (debounce)

    // DOM
    const authSec = document.getElementById("auth-section");
    const appSec = document.getElementById("app-section");
    const userEmailSpan = document.getElementById("userEmail");
    const tbody = document.getElementById("tableBody");
    const authError = document.getElementById("authError");
    const emailInput = document.getElementById("emailInput");
    const passInput = document.getElementById("passInput");
    const searchInput = document.getElementById("searchInput");
    const viewFilter = document.getElementById("viewFilter");
    const typeInput = document.getElementById("typeInput");
    const ratingStars = document.getElementById("ratingStars");
    const suggestions = document.getElementById("suggestions");
    const btnTheme = document.getElementById("btnTheme");
    const csvFile = document.getElementById("csvFile");
    const detailSec = document.getElementById("detail-section");
    const detailPoster = document.getElementById("detailPoster");
    const detailTitle = document.getElementById("detailTitle");
    const detailMetaLine = document.getElementById("detailMetaLine");
    const detailWatched = document.getElementById("detailWatched");
    const detailStars = document.getElementById("detailStars");
    const descInput = document.getElementById("descInput");
    const saveStatus = document.getElementById("saveStatus");
    const detailMeta = document.getElementById("detailMeta");
    const detailMal = document.getElementById("detailMal");

    // TRYB CIEMNY (wybór zapamiętywany w localStorage)
    if (localStorage.getItem("motyw") === "ciemny") {
      document.body.classList.add("dark");
      btnTheme.textContent = "☀";
    }
    btnTheme.onclick = () => {
      const ciemny = document.body.classList.toggle("dark");
      localStorage.setItem("motyw", ciemny ? "ciemny" : "jasny");
      btnTheme.textContent = ciemny ? "☀" : "☾";
    };

    // AUTH
    document.getElementById("btnLogin").onclick = async () => {
      authError.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) {
        authError.textContent = err.message;
      }
    };

    document.getElementById("btnRegister").onclick = async () => {
      authError.textContent = "";
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) {
        authError.textContent = err.message;
      }
    };

    document.getElementById("btnLogout").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authSec.classList.add("hidden");
        appSec.classList.remove("hidden");
        userEmailSpan.textContent = user.email;
        subskrybujDane(user.uid);
        sprawdzTrase();
      } else {
        authSec.classList.remove("hidden");
        appSec.classList.add("hidden");
        detailSec.classList.add("hidden");
        currentDetailId = null;
        tbody.innerHTML = "";
        if (unsubscribeFirestore) unsubscribeFirestore();
      }
    });

    // POBIERANIE DANYCH
    function subskrybujDane(uid) {
      const itemsRef = collection(db, "watchlist", uid, "items");
      unsubscribeFirestore = onSnapshot(itemsRef, (snapshot) => {
        allItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        przeliczIWyswietl();
        sprawdzTrase();
      });
    }

    // ROUTING - PODSTRONA TYTUŁU (odnośnik w formacie #/film/ID)
    window.onhashchange = sprawdzTrase;

    function sprawdzTrase() {
      const match = location.hash.match(/^#\/film\/(.+)$/);
      if (currentUser && match) {
        pokazSzczegoly(decodeURIComponent(match[1]));
      } else {
        currentDetailId = null;
        detailSec.classList.add("hidden");
        if (currentUser) appSec.classList.remove("hidden");
      }
    }

    function pokazSzczegoly(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) {
        // Brak takiego tytułu (np. został usunięty) - wracamy do listy
        location.hash = "#/";
        return;
      }

      currentDetailId = id;
      appSec.classList.add("hidden");
      detailSec.classList.remove("hidden");

      detailTitle.textContent = item.title;
      detailMetaLine.textContent = liniaMeta(item);
      detailMetaLine.classList.toggle("hidden", !liniaMeta(item));

      if (item.posterPath) {
        detailPoster.src = item.posterLarge || item.posterPath;
        detailPoster.classList.remove("hidden");
      } else {
        detailPoster.classList.add("hidden");
      }

      if (item.malUrl) {
        detailMal.href = item.malUrl;
        detailMal.textContent = item.malUrl.includes("myanimelist")
          ? "Otwórz na MyAnimeList ↗"
          : "Otwórz na AniList ↗";
        detailMal.classList.remove("hidden");
      } else {
        detailMal.classList.add("hidden");
      }

      detailWatched.checked = !!item.watched;
      rysujOceneSzczegolow();

      // Nie nadpisujemy pola, gdy użytkownik właśnie w nim pisze
      if (document.activeElement !== descInput) {
        descInput.value = item.description || "";
      }

      detailMeta.textContent = (item.score ? "Ocena bazy: " + item.score + " / 100 · " : "") +
        "Dodano: " + (item.createdAt && item.createdAt.toMillis
        ? new Date(item.createdAt.toMillis()).toLocaleString("pl-PL")
        : "—");
    }

    // ESCAPE TEKSTU PRZED WSTAWIENIEM DO HTML
    function esc(tekst) {
      return String(tekst ?? "").replace(/[&<>"']/g, znak =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[znak])
      );
    }

    // LINIA METADANYCH POD TYTUŁEM (rok · typ · gatunki)
    function liniaMeta(item) {
      const czesci = [];
      if (item.year) czesci.push(item.year);
      if (item.type) czesci.push(item.type === "tv" ? "serial" : "film");
      if (item.episodes) czesci.push("odc. " + item.episodes);
      if (item.genres && item.genres.length) czesci.push(item.genres.join(", "));
      return czesci.join(" · ");
    }

    function metaHtml(item) {
      const meta = liniaMeta(item);
      return meta ? `<div class="title-meta">${esc(meta)}</div>` : "";
    }

    // GWIAZDKI OCENY (1-10)
    function pokazGwiazdki(kontener, wybrana, onKlik) {
      kontener.innerHTML = "";
      for (let i = 1; i <= 10; i++) {
        const gw = document.createElement("span");
        const pelna = i <= wybrana;
        gw.className = "star" + (pelna ? "" : " off");
        gw.textContent = pelna ? "★" : "☆";
        gw.title = i + " / 10";
        gw.onclick = () => onKlik(i);
        kontener.appendChild(gw);
      }
    }

    function htmlGwiazdek(ocena, id) {
      let html = "";
      for (let i = 1; i <= 10; i++) {
        const pelna = ocena && i <= ocena;
        html += `<span class="star${pelna ? "" : " off"}" data-id="${id}" data-value="${i}" title="${i} / 10">${pelna ? "★" : "☆"}</span>`;
      }
      return html;
    }

    // Gwiazdki w formularzu dodawania
    function rysujNowaOcena() {
      pokazGwiazdki(ratingStars, nowaOcena || 0, (i) => {
        nowaOcena = (nowaOcena === i) ? null : i;
        rysujNowaOcena();
      });
    }
    rysujNowaOcena();

    // Gwiazdki na stronie tytułu
    function rysujOceneSzczegolow() {
      const item = allItems.find(i => i.id === currentDetailId);
      if (!item) return;
      pokazGwiazdki(detailStars, item.rating || 0, (i) => {
        if (!currentDetailId) return;
        const aktualny = allItems.find(x => x.id === currentDetailId);
        updateDoc(doc(db, "watchlist", currentUser.uid, "items", currentDetailId), {
          rating: (aktualny && aktualny.rating === i) ? null : i
        });
      });
    }

    // PODPOWIEDZI TYTUŁÓW Z BAZY ANIME W FORMULARZU
    titleInput.oninput = () => {
      clearTimeout(licznikSzukania);
      const q = titleInput.value.trim();
      wybranyAnime = null;
      if (q.length < 2) {
        suggestions.classList.add("hidden");
        return;
      }
      licznikSzukania = setTimeout(() => szukajAnime(q), 500);
    };

    // Tytuł do wyświetlenia - najpierw angielski, potem oryginalny
    function tytulAnime(r) {
      return (r.title && (r.title.english || r.title.romaji)) || "Bez tytułu";
    }

    // Opis z AniList zawiera znaczniki HTML - czyścimy je
    function czystyOpis(tekst) {
      if (!tekst) return "";
      return tekst.replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
    }

    async function szukajAnime(q) {
      try {
        const resp = await fetch(ANILIST_API, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            // isAdult: false - filtruje tytuły eksplicytnego charakteru
            query: `query ($szukane: String) {
              Page(page: 1, perPage: 7) {
                media(search: $szukane, type: ANIME, isAdult: false) {
                  id idMal siteUrl
                  title { romaji english }
                  format
                  startDate { year }
                  episodes
                  genres
                  averageScore
                  description
                  coverImage { medium extraLarge }
                }
              }
            }`,
            variables: { szukane: q }
          })
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const dane = await resp.json();
        wynikiAnime = (((dane.data || {}).Page || {}).media) || [];

        if (wynikiAnime.length === 0) {
          suggestions.classList.add("hidden");
          return;
        }

        suggestions.innerHTML = wynikiAnime.map((r, idx) => {
          const typ = r.format === "MOVIE" ? "film" : "serial";
          const rok = (r.startDate && r.startDate.year) || "?";
          return `<div class="suggestion" data-idx="${idx}">${esc(tytulAnime(r))} (${rok}) [${typ}]</div>`;
        }).join("");
        suggestions.classList.remove("hidden");

        document.querySelectorAll(".suggestion").forEach(el => {
          el.onclick = () => {
            const r = wynikiAnime[Number(el.getAttribute("data-idx"))];
            wybranyAnime = {
              malId: r.idMal || null,
              malUrl: r.idMal ? "https://myanimelist.net/anime/" + r.idMal : (r.siteUrl || null),
              type: r.format === "MOVIE" ? "movie" : "tv",
              year: (r.startDate && r.startDate.year) || null,
              episodes: r.episodes || null,
              posterPath: (r.coverImage && r.coverImage.medium) || null,
              posterLarge: (r.coverImage && r.coverImage.extraLarge) || null,
              overview: czystyOpis(r.description),
              genres: r.genres || [],
              score: r.averageScore || null
            };
            titleInput.value = tytulAnime(r);
            typeInput.value = wybranyAnime.type;
            suggestions.classList.add("hidden");
          };
        });
      } catch (err) {
        // Limit zapytań / brak internetu - po prostu chowamy podpowiedzi
        suggestions.classList.add("hidden");
      }
    }

    // Zamknięcie podpowiedzi po kliknięciu poza nimi
    document.onclick = (e) => {
      if (!e.target.closest(".tytul-wrap")) suggestions.classList.add("hidden");
    };

    // LOGIKA FILTROWANIA I SORTOWANIA
    function przeliczIWyswietl() {
      const query = searchInput.value.toLowerCase().trim();
      const filterMode = viewFilter.value;

      let result = allItems.filter(item =>
        (item.title || "").toLowerCase().includes(query)
      );

      if (filterMode === "unwatched") {
        result = result.filter(item => !item.watched);
      } else if (filterMode === "watched") {
        result = result.filter(item => item.watched);
      } else if (filterMode === "movies") {
        result = result.filter(item => item.type === "movie");
      } else if (filterMode === "tv") {
        result = result.filter(item => item.type === "tv");
      } else if (filterMode === "rating_desc") {
        result.sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
      } else {
        // Domyślnie ("all"): Nieobejrzane na górze, obejrzane na dole
        result.sort((a, b) => (a.watched === b.watched ? 0 : a.watched ? 1 : -1));
      }

      renderTable(result);
    }

    // RENDEROWANIE TABELI
    function renderTable(items) {
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Brak pozycji do wyświetlenia</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => `
        <tr class="${item.watched ? 'watched-row' : ''}">
          <td style="text-align: center;">
            <input type="checkbox" class="toggle-watched" data-id="${item.id}" ${item.watched ? 'checked' : ''}>
          </td>
          <td>
            ${item.posterPath ? `<img class="poster" src="${item.posterPath}" alt="" style="height: 60px; margin-right: 8px;">` : ""}
            <a href="#/film/${item.id}">${esc(item.title)}</a>
            ${metaHtml(item)}
          </td>
          <td>${htmlGwiazdek(item.rating, item.id)}</td>
          <td>
            <button data-id="${item.id}" class="btn-del">Usuń</button>
          </td>
        </tr>
      `).join("");

      // Zmiana statusu checkboxem (natychmiastowy update w Firestore)
      document.querySelectorAll(".toggle-watched").forEach(cb => {
        cb.onchange = (e) => {
          const docId = cb.getAttribute("data-id");
          const isWatched = e.target.checked;
          updateDoc(doc(db, "watchlist", currentUser.uid, "items", docId), {
            watched: isWatched
          });
        };
      });

      // Zmiana oceny gwiazdkami (natychmiastowy update w Firestore)
      document.querySelectorAll(".star[data-id]").forEach(gw => {
        gw.onclick = () => {
          const docId = gw.getAttribute("data-id");
          const wartosc = Number(gw.getAttribute("data-value"));
          const item = allItems.find(i => i.id === docId);
          updateDoc(doc(db, "watchlist", currentUser.uid, "items", docId), {
            rating: (item && item.rating === wartosc) ? null : wartosc
          });
        };
      });

      // Usuwanie
      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.onclick = () => {
          const docId = btn.getAttribute("data-id");
          deleteDoc(doc(db, "watchlist", currentUser.uid, "items", docId));
        };
      });
    }

    // DODAWANIE WPISU
    document.getElementById("addForm").onsubmit = async (e) => {
      e.preventDefault();
      const titleEl = document.getElementById("titleInput");
      const watchedEl = document.getElementById("watchedInput");

      await addDoc(collection(db, "watchlist", currentUser.uid, "items"), {
        title: titleEl.value.trim(),
        type: typeInput.value || (wybranyAnime && wybranyAnime.type) || null,
        year: (wybranyAnime && wybranyAnime.year) || null,
        episodes: (wybranyAnime && wybranyAnime.episodes) || null,
        genres: (wybranyAnime && wybranyAnime.genres) || [],
        posterPath: (wybranyAnime && wybranyAnime.posterPath) || null,
        posterLarge: (wybranyAnime && wybranyAnime.posterLarge) || null,
        malUrl: (wybranyAnime && wybranyAnime.malUrl) || null,
        malId: (wybranyAnime && wybranyAnime.malId) || null,
        score: (wybranyAnime && wybranyAnime.score) || null,
        rating: nowaOcena,
        watched: watchedEl.checked,
        description: (wybranyAnime && wybranyAnime.overview) || "",
        createdAt: serverTimestamp()
      });

      titleEl.value = "";
      typeInput.value = "";
      watchedEl.checked = false;
      nowaOcena = null;
      rysujNowaOcena();
      wybranyAnime = null;
    };

    // STRONA TYTUŁU - ZMIANA STATUSU
    detailWatched.onchange = () => {
      if (!currentDetailId) return;
      updateDoc(doc(db, "watchlist", currentUser.uid, "items", currentDetailId), {
        watched: detailWatched.checked
      });
    };

    // ZAPIS OPISU
    document.getElementById("btnSaveDesc").onclick = async () => {
      if (!currentDetailId) return;
      saveStatus.textContent = "";
      try {
        await updateDoc(doc(db, "watchlist", currentUser.uid, "items", currentDetailId), {
          description: descInput.value
        });
        saveStatus.textContent = "Zapisano ✓";
        setTimeout(() => { saveStatus.textContent = ""; }, 2000);
      } catch (err) {
        saveStatus.textContent = "Błąd zapisu: " + err.message;
      }
    };

    // EKSPORT CSV
    document.getElementById("btnExport").onclick = () => {
      const naglowki = ["tytul", "typ", "rok", "odcinki", "ocena", "obejrzane", "gatunki", "opis", "plakat", "plakatDuzy", "malUrl", "malId", "ocenaBazy", "dodano"];
      const wiersze = allItems.map(item => [
        item.title || "",
        item.type || "",
        item.year || "",
        item.episodes ?? "",
        item.rating ?? "",
        item.watched ? "tak" : "nie",
        (item.genres || []).join("|"),
        item.description || "",
        item.posterPath || "",
        item.posterLarge || "",
        item.malUrl || "",
        item.malId ?? "",
        item.score ?? "",
        item.createdAt && item.createdAt.toMillis ? new Date(item.createdAt.toMillis()).toISOString() : ""
      ]);
      const csv = [naglowki, ...wiersze].map(w => w.map(poleCsv).join(",")).join("\r\n");

      // BOM na początku, żeby Excel poprawnie otworzył polskie znaki
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "watchlista.csv";
      link.click();
      URL.revokeObjectURL(link.href);
    };

    function poleCsv(wartosc) {
      const tekst = String(wartosc ?? "");
      return /[",\r\n]/.test(tekst) ? `"${tekst.replace(/"/g, '""')}"` : tekst;
    }

    // IMPORT CSV
    document.getElementById("btnImport").onclick = () => csvFile.click();

    csvFile.onchange = async () => {
      const plik = csvFile.files[0];
      if (!plik) return;
      const tekst = await plik.text();
      const pozycje = parsujCSV(tekst).slice(1); // pierwsza linia to nagłówki
      if (pozycje.length === 0) {
        csvFile.value = "";
        return;
      }
      if (!confirm(`Zaimportować ${pozycje.length} pozycji z pliku?`)) {
        csvFile.value = "";
        return;
      }

      for (const w of pozycje) {
        if (!(w[0] || "").trim()) continue;
        await addDoc(collection(db, "watchlist", currentUser.uid, "items"), {
          title: w[0].trim(),
          type: w[1] || null,
          year: w[2] ? Number(w[2]) : null,
          episodes: w[3] ? Number(w[3]) : null,
          rating: w[4] ? Number(w[4]) : null,
          watched: w[5] === "tak",
          genres: w[6] ? w[6].split("|") : [],
          description: w[7] || "",
          posterPath: w[8] || null,
          posterLarge: w[9] || null,
          malUrl: w[10] || null,
          malId: w[11] ? Number(w[11]) : null,
          score: w[12] ? Number(w[12]) : null,
          createdAt: (w[13] && !isNaN(Date.parse(w[13]))) ? Timestamp.fromDate(new Date(w[13])) : serverTimestamp()
        });
      }
      csvFile.value = "";
    };

    // PROSTY PARSER CSV (obsługuje cudzysłowy i przecinki wewnątrz pól)
    function parsujCSV(tekst) {
      const wiersze = [[]];
      let pole = "";
      let wCudzyslowie = false;
      for (let i = 0; i < tekst.length; i++) {
        const znak = tekst[i];
        if (wCudzyslowie) {
          if (znak === '"' && tekst[i + 1] === '"') { pole += '"'; i++; }
          else if (znak === '"') wCudzyslowie = false;
          else pole += znak;
        } else if (znak === '"') {
          wCudzyslowie = true;
        } else if (znak === ",") {
          wiersze[wiersze.length - 1].push(pole);
          pole = "";
        } else if (znak === "\n") {
          wiersze[wiersze.length - 1].push(pole);
          pole = "";
          wiersze.push([]);
        } else if (znak !== "\r") {
          pole += znak;
        }
      }
      wiersze[wiersze.length - 1].push(pole);
      return wiersze.filter(w => w.length > 1 || (w[0] || "").trim() !== "");
    }

    // EVENTY WYSZUKIWARKI I FILTRA
    searchInput.oninput = przeliczIWyswietl;
    viewFilter.onchange = przeliczIWyswietl;
  </script>
</body>
</html>
