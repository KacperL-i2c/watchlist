<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Watchlista</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 600px; margin: auto; }
    input, button { padding: 6px 10px; margin: 4px 0; font-family: inherit; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: left; }
    .hidden { display: none; }
    .auth-box { border: 1px solid #ccc; padding: 15px; border-radius: 4px; }
    .error { color: red; font-size: 12px; }
  </style>
</head>
<body>

  <!-- 1. SEKCJA LOGOWANIA / REJESTRACJI -->
  <div id="auth-section" class="auth-box">
    <h3>Logowanie</h3>
    <input type="email" id="emailInput" placeholder="Twój e-mail"><br>
    <input type="password" id="passInput" placeholder="Hasło (min. 6 znaków)"><br>
    <button id="btnLogin">Zaloguj</button>
    <button id="btnRegister">Zarejestruj nowe konto</button>
    <div id="authError" class="error"></div>
  </div>

  <!-- 2. SEKCJA GŁÓWNA (po zalogowaniu) -->
  <div id="app-section" class="hidden">
    <p>Zalogowano: <b id="userEmail"></b> <button id="btnLogout">Wyloguj</button></p>

    <form id="addForm">
      <input type="text" id="titleInput" placeholder="Tytuł..." required>
      <button type="submit">Dodaj</button>
    </form>

    <br>
    <input type="text" id="searchInput" placeholder="Szukaj w tabeli...">

    <table>
      <thead>
        <tr>
          <th>Tytuł</th>
          <th style="width: 60px;">Akcja</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TWOJA KONFIGURACJA Z KONSOLI:
    const firebaseConfig = {
      apiKey: "AIzaSyAi84JAM0e1M7muvpq4CcJJA7NahEhwEVE",
      authDomain: "watchlist-bfe31.firebaseapp.com",
      projectId: "watchlist-bfe31",
      storageBucket: "watchlist-bfe31.firebasestorage.app",
      messagingSenderId: "586950061109",
      appId: "1:586950061109:web:578da030d6b52586ab957c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let allItems = [];
    let unsubscribeFirestore = null;

    // DOM
    const authSec = document.getElementById("auth-section");
    const appSec = document.getElementById("app-section");
    const userEmailSpan = document.getElementById("userEmail");
    const tbody = document.getElementById("tableBody");
    const authError = document.getElementById("authError");
    const emailInput = document.getElementById("emailInput");
    const passInput = document.getElementById("passInput");

    // LOGOWANIE
    document.getElementById("btnLogin").onclick = async () => {
      authError.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) {
        authError.textContent = err.message;
      }
    };

    // REJESTRACJA (klikasz raz, żeby stworzyć swoje konto)
    document.getElementById("btnRegister").onclick = async () => {
      authError.textContent = "";
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) {
        authError.textContent = err.message;
      }
    };

    // WYLOGOWANIE
    document.getElementById("btnLogout").onclick = () => signOut(auth);

    // OBSŁUGA STANU SESJI
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authSec.classList.add("hidden");
        appSec.classList.remove("hidden");
        userEmailSpan.textContent = user.email;
        subskrybujDane(user.uid);
      } else {
        authSec.classList.remove("hidden");
        appSec.classList.add("hidden");
        tbody.innerHTML = "";
        if (unsubscribeFirestore) unsubscribeFirestore();
      }
    });

    // POBIERANIE DANYCH (watchlist/{uid}/items)
    function subskrybujDane(uid) {
      const itemsRef = collection(db, "watchlist", uid, "items");
      unsubscribeFirestore = onSnapshot(itemsRef, (snapshot) => {
        allItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTable(allItems);
      });
    }

    // RENDER TABELI
    function renderTable(items) {
      tbody.innerHTML = items.map(item => `
        <tr>
          <td>${item.title}</td>
          <td><button data-id="${item.id}" class="btn-del">Usuń</button></td>
        </tr>
      `).join("");

      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.onclick = () => {
          const docId = btn.getAttribute("data-id");
          deleteDoc(doc(db, "watchlist", currentUser.uid, "items", docId));
        };
      });
    }

    // DODAWANIE WPISU
    document.getElementById("addForm").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("titleInput");
      await addDoc(collection(db, "watchlist", currentUser.uid, "items"), {
        title: input.value
      });
      input.value = "";
    };

    // FILTROWANIE
    document.getElementById("searchInput").oninput = (e) => {
      const q = e.target.value.toLowerCase();
      renderTable(allItems.filter(i => i.title.toLowerCase().includes(q)));
    };
  </script>
</body>
</html>
